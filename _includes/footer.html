<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="footer-contact-inline d-flex flex-wrap justify-content-center align-items-start text-center">
            <div class="footer-contact-item">
              <h5 class="text-light">Personal Email</h5>
              <div class="spacer"></div>
              <a href="mailto:{{ site.data.settings.email }}" class="text-white paragraph-lg font-secondary">{{ site.data.settings.email }}</a>
            </div>
            <div class="footer-contact-item">
              <h5 class="text-light">Phone</h5>
              <div class="spacer"></div>
              <p class="text-white paragraph-lg font-secondary mb-0">{{ site.data.settings.phone }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-copyright border-top text-center border-dark">
    <p class="mb-0">{{ site.data.settings.copyright | markdownify }}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
