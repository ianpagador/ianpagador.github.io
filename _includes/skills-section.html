{% if site.data.settings.skills %}
<!-- skills -->
<section class="section skills-word-cloud-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">{{ site.data.settings.skills-title }}</h2>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="skills-word-cloud-wrapper">
          <canvas id="skills-word-cloud" aria-label="Technical skills word cloud"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script type="application/json" id="skills-word-cloud-data">{{ site.data.settings.skills | jsonify }}</script>
</section>
<!-- /skills -->
{% endif %}
