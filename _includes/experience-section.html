{% if site.data.settings.experience %}
<!-- experience -->
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">{{ site.data.settings.experience-title }}</h2>
      </div>
      {% for experience in site.data.settings.experience %}
      <div class="col-lg-4 col-md-6 text-center mb-5">
        <img class="org-logo experience-logo mx-auto d-block" src="{{ site.baseurl }}/assets/images/{{ experience.icon }}" alt="{{ experience.organization }} logo">
        <p class="mb-0">{{ experience.date }}</p>
        <h4>{{ experience.name }}</h4>
        <h6 class="text-light">{{ experience.organization }}</h6>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ./experience -->
{% endif %}
