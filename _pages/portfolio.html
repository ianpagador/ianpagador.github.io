---
layout: page
title: My Portfolio
---
<!-- portfolio -->
<section class="section">
  <div class="container">
    <div class="row portfolio-featured">
      {% for item in site.data.settings.portfolio-items %}
      <div class="col-lg-6 mb-5">
        <article class="portfolio-card shadow rounded-lg overflow-hidden h-100">
          <div class="portfolio-card-image hover-wrapper">
            <img src="{{ site.baseurl }}/{{ item.image }}" alt="{{ item.title }}" class="img-fluid w-100 d-block">
            <div class="hover-overlay">
              <div class="hover-content">
                <a class="btn btn-light" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">view project</a>
              </div>
            </div>
          </div>
          <div class="portfolio-card-body p-4 p-lg-5">
            <p class="text-primary font-secondary mb-2">{{ item.subtitle }}</p>
            <h3 class="mb-3">{{ item.title }}</h3>
            <p class="paragraph-lg text-dark mb-4">{{ item.description }}</p>
            <a class="btn btn-primary" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">view project</a>
          </div>
        </article>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- /portfolio -->
